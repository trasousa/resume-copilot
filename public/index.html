<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4E4B'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
  <title>The Desk · Resume Copilot</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="topnav"></div>
  <main>
    <header class="desk-masthead">
      <p class="dateline" id="dateline"></p>
      <h1 class="desk-statement" id="mastheadStatement">Loading your applications…</h1>
    </header>

    <div class="desk-body">
      <section>
        <h2 class="section-rule">On your desk today</h2>
        <ol class="queue-list" id="attentionQueue"></ol>
      </section>

      <section>
        <h2 class="section-rule">Pipeline digest</h2>
        <div id="statTiles" class="ledger-line"></div>
        <div class="stage-strip" id="stageStrip"></div>
      </section>
    </div>

    <footer class="colophon">
      <div id="activityGraph"></div>
      <div class="colophon-notes">
        <span id="colophonBudget"></span>
        <span id="colophonUpdated"></span>
      </div>
    </footer>
  </main>

  <script type="module" src="js/index.js"></script>
</body>
</html>
