<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4E4B'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
  <title>Studio · Resume Copilot</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="topnav"></div>
  <main>
    <header class="workspace-masthead">
      <p class="workspace-kicker">Studio</p>
      <h1 class="workspace-statement" id="studioStatement">Loading your CVs…</h1>
    </header>

    <div id="onboardingBanner"></div>

    <div class="studio-layout">
      <aside class="studio-rail">
        <h2 class="section-rule">Library</h2>
        <div class="cv-rail" id="cvRail"></div>

        <details class="intake" id="intakePanel">
          <summary>Add a CV</summary>
          <div class="intake-block">
            <h3>Upload a file</h3>
            <label>File (.docx, .txt, .md)</label>
            <input type="file" id="cvFile" accept=".docx,.txt,.md" />
            <label>Label</label>
            <input type="text" id="uploadLabel" placeholder="e.g. Master CV, or 'CV - 2024 backup'" />
            <div class="row" style="margin-top:12px;">
              <button class="btn small" id="uploadBtn">Upload</button>
            </div>
          </div>
          <div class="intake-block">
            <h3>Or paste text</h3>
            <label>Label</label>
            <input type="text" id="pasteLabel" />
            <label>CV content</label>
            <textarea id="pasteContent" rows="5"></textarea>
            <div class="row" style="margin-top:12px;">
              <button class="btn small" id="pasteBtn">Save</button>
            </div>
          </div>
        </details>
      </aside>

      <section class="studio-bench" id="studioBench">
        <div class="bench-tabs" id="benchTabs">
          <button type="button" class="bench-tab active" data-bench="document">Document</button>
          <button type="button" class="bench-tab" data-bench="tailor">Tailor</button>
        </div>

        <div class="bench-head">
          <p class="bench-kicker" id="benchKicker"></p>
          <span class="pill" id="matchPill" style="display:none;"></span>
        </div>

        <div id="benchDocument">
          <div id="cvDocMount"></div>
        </div>

        <div id="benchTailor" hidden>
          <div class="tailor-form">
            <div>
              <label>Role flavor</label>
              <select id="flavor">
                <option value="">General</option>
                <option value="tech">Tech / Engineering / PM</option>
                <option value="executive">Executive / C-suite</option>
                <option value="academic">Academic</option>
                <option value="creative">Creative / Design</option>
                <option value="careerChange">Career change</option>
              </select>
              <label>Job posting link (optional)</label>
              <input type="text" id="jobPostLink" placeholder="https://..." />
              <div class="row" style="margin-top:8px;">
                <button type="button" class="btn secondary small" id="fetchJobPost">Fetch job post</button>
                <span id="fetchStatus" class="muted"></span>
              </div>
              <a class="outreach-callout" href="outreach.html">
                <span>Need a cover letter or cold email instead?<br><strong>Open the Outreach Studio &rarr;</strong></span>
              </a>
            </div>
            <div>
              <label>Job posting text</label>
              <textarea id="jobPost" rows="12" placeholder="Paste the full job description here, or fetch it from the link above"></textarea>
              <div class="row" style="margin-top:12px;">
                <button class="btn" id="runBtn">Analyze &amp; Tailor</button>
                <span id="status" class="muted"></span>
              </div>
            </div>
          </div>
          <div id="result"></div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/studio.js"></script>
</body>
</html>
