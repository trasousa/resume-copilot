<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Resume Copilot</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main style="max-width: 24rem; margin: 12vh auto; padding: 0 1rem;">
    <h1 style="margin-bottom: 0.25rem;">Resume Copilot</h1>
    <p class="muted" style="margin-top: 0;">Sign in to continue.</p>

    <div class="card">
      <a
        class="btn"
        href="/api/auth/google/start"
        style="display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;"
      >
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Sign in with Google
      </a>
      <div id="status" class="muted" style="margin-top: 10px;"></div>
    </div>
  </main>

  <script type="module">
    const status = document.getElementById("status");

    // If auth is disabled (SKIP_AUTH=1, e.g. behind Cloudflare Access), don't
    // make people click through a sign-in that isn't actually checked.
    try {
      const res = await fetch("/api/auth/status");
      const { authRequired } = await res.json();
      if (!authRequired) location.href = "index.html";
    } catch {}

    // The callback redirects here with ?error=... on any sign-in failure
    // (wrong Google account, not on the allow-list, expired state, etc).
    const error = new URLSearchParams(location.search).get("error");
    if (error) status.textContent = error;
  </script>
</body>
</html>
