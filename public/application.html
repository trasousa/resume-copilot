<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4E4B'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E" />
  <title>Application · Resume Copilot</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="topnav"></div>
  <main>
    <a href="pipeline.html" class="dossier-back">&larr; Back to Pipeline</a>

    <header class="dossier-masthead">
      <p class="dateline" id="dossierDateline"></p>
      <h1 class="dossier-headline" id="dossierHeadline">Opening the file…</h1>
      <p class="dossier-standfirst" id="dossierStandfirst"></p>
    </header>

    <div class="fact-ledger" id="factLedger"></div>

    <div class="dossier-body">
      <div>
        <section class="dossier-section" id="tailorSection">
          <h2 class="section-rule">Tailored CV</h2>
          <p class="muted" id="cvStatus">No tailored CV yet.</p>
          <div class="row" style="align-items:flex-end; margin-top:12px;">
            <div style="min-width:220px;">
              <label>Role flavor</label>
              <select id="flavor">
                <option value="">General</option>
                <option value="tech">Tech / Engineering / PM</option>
                <option value="executive">Executive / C-suite</option>
                <option value="academic">Academic</option>
                <option value="creative">Creative / Design</option>
                <option value="careerChange">Career change</option>
              </select>
            </div>
            <button class="btn" id="tailorBtn">Tailor CV to this posting</button>
          </div>
          <div id="tailorResult"></div>
        </section>

        <section class="dossier-section" id="documentsSection">
          <h2 class="section-rule">Generated documents</h2>
          <div class="doc-index" id="docIndex"></div>
          <details id="docGenerator">
            <summary class="dossier-back" style="cursor:pointer; display:inline-block; margin-top:18px;">Write something new</summary>
            <div class="doc-maker" id="docMaker"></div>
          </details>
        </section>

        <section class="dossier-section" id="fileSection">
          <h2 class="section-rule">The file</h2>
          <label>Location</label>
          <input type="text" id="d-location" />
          <label>Posting link</label>
          <input type="text" id="d-link" />
          <label>Job post text</label>
          <textarea id="d-jobPost" rows="6"></textarea>
          <label>Notes</label>
          <textarea id="d-notes" rows="4" placeholder="Interviewer names, impressions, follow-ups..."></textarea>
          <div class="row" style="margin-top:12px;">
            <button class="btn" id="saveDetails">Save</button>
            <span id="saveStatus" class="muted"></span>
          </div>
        </section>
      </div>

      <aside class="dossier-rail">
        <section>
          <h2 class="section-rule">Stage</h2>
          <div id="stageBlock"></div>
        </section>

        <section style="margin-top:34px;">
          <h2 class="section-rule">The record</h2>
          <ol class="record-list" id="activityRecord"></ol>
          <button class="btn secondary small" id="addReminderBtn" style="margin-top:14px;">Add reminder</button>
        </section>

        <section class="danger-note">
          <button type="button" class="cv-row-action danger" id="deleteAppBtn">Delete this application</button>
        </section>
      </aside>
    </div>
  </main>

  <dialog id="reminderDialog">
    <div class="card">
      <h2>Add reminder</h2>
      <label>Title</label>
      <input type="text" id="r-title" placeholder="Follow up with recruiter" />
      <label>Date</label>
      <input type="date" id="r-date" />
      <div class="row" style="margin-top:16px; justify-content:flex-end;">
        <button class="btn secondary" id="cancelReminder">Cancel</button>
        <button class="btn" id="saveReminder">Add</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/application.js"></script>
</body>
</html>
