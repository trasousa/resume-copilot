name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the merge commit
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --log-opts="--all" -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:skills
      # No CLOUDFLARE_API_TOKEN needed -- `wrangler deploy --dry-run` bundles
      # and validates config without touching the Cloudflare API (verified
      # locally in an unauthenticated environment before wiring this up).
      - run: npm run build

  deploy:
    needs: [secret-scan, lint, build]
    # Only ever deploys from main, and only on an actual push (a merged PR),
    # never on pull_request -- a PR from a fork could otherwise exfiltrate
    # the deploy secrets just by opening it.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tail Worker deploy is intentionally NOT run here. tail_consumers is
      # commented out in wrangler.jsonc (Tail Workers need the Workers Paid
      # plan), and observability is instead recovered on the free tier via
      # agents/observability's subscribe() straight in the main Worker (see
      # src/index.js) plus this Worker's own `observability: { enabled: true
      # }` -- see docs/superpowers/specs/2026-08-16-resume-agent-core-design.md.
      # Deploying tail-worker/ here would just redeploy an orphaned Worker
      # nothing forwards events to. Re-add this step (before the main Worker
      # step, so tail_consumers' reference is never briefly dangling) if/when
      # the account upgrades and tail_consumers is uncommented.
      - name: Deploy main Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
